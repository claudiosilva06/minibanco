services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: minibanco
      POSTGRES_USER: minibanco
      POSTGRES_PASSWORD: minibanco
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minibanco -d minibanco"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/minibanco
      DB_USER: minibanco
      DB_PASSWORD: minibanco
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  dados-postgres:
