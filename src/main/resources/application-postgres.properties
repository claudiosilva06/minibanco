# Perfil usado no docker-compose: troca o H2 em memória por PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/minibanco}
spring.datasource.username=${DB_USER:minibanco}
spring.datasource.password=${DB_PASSWORD:minibanco}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
